name: Mirror to msg-CareerPaths

on:
  push:
    branches:
      - main

concurrency:
  group: mirror-main
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify secrets
        run: |
          if [ -z "$MIRROR_PAT" ]; then
            echo "::error::MIRROR_PAT is empty or not set!"
            exit 1
          fi
          if [ -z "$MIRROR_REPO" ]; then
            echo "::error::MIRROR_REPO is empty or not set!"
            exit 1
          fi
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
          MIRROR_REPO: ${{ vars.MIRROR_REPO }}

      - name: Push mirror
        run: |
          MIRROR_URL="https://x-access-token:${{ secrets.MIRROR_PAT }}@${{ vars.MIRROR_REPO }}"
          git remote set-url mirror "$MIRROR_URL" 2>/dev/null \
            || git remote add mirror "$MIRROR_URL"
          git push mirror HEAD:refs/heads/main --force
