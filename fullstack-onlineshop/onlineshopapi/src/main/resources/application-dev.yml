spring:
  profiles:
    include:
      - postgres
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopdb}
    username: ${DB_USERNAME:shopuser}
    password: ${DB_PASSWORD:shoppassword}

logging:
  level:
    msg.onlineshopapi: DEBUG
    org.springframework.web: DEBUG
