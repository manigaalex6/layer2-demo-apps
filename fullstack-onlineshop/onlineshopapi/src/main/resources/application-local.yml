spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    locations:
      - classpath:/db/migration
      - classpath:/mock/db

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.hibernate: WARN
    org.springframework.jdbc: WARN
    msg.onlineshopapi: INFO
