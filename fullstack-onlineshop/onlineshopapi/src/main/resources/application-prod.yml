# Production environment configuration
spring:
  profiles:
    include: postgres
  
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

logging:
  level:
    root: WARN
    msg.onlineshopapi: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
